<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tabel dengan garis dan cellpadding dan cellpacing</title>
</head>
<body>
    <!-- Bagian kepala tabel -->
     <thead>
        <tr>
            <th>Baris</th>
            <th>Kolom</th>
        </tr>
     </thead>
    <!-- Bagian body tabel -->
     <tbody>
        <tr>
            <td>Sel 1</td>
            <td>Sel 2</td>
        </tr>
        <tr>
            <td>Sel 3</td>
            <td>Sel 4</td>
        </tr>
        <tr>
            <td>Sel 5</td>
            <td>Sel 6</td>
        </tr>
     </tbody>
</body>
</html>
