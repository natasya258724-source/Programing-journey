<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 8.1</title>
    <style>
        h1 {font-size: 32px;
        }
        p {font-size: 14pt;
        }
        .box-cm {
            width: 5cm;
            height: 3cm;
            background-color: lightblue;
            margin: 10px;
            text-align: center;
            line-height: 3cm;
        }
        .box-percent {
            width: 50%;
            height: 100px;
            background-color: lightgreen;
            margin: 10px;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Judul dengan Satuan px</h1>
    <p>Ini adalah paragraf dengan ukuran font menggunakan satuan pt.</p>

    <div class="box-cm">Box dengan cm</div>
    <div class="box-percent">Box dengan %</div>
</body>
</html>
