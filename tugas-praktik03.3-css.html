<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>
    <style>
    .title {
    text-transform: uppercase;
    }
    .paragraph {
    text-transform: capitalize;
    }
    .original {
    text-transform: none;
    }
    </style>
</head>
<body>
<h1 class="title">judul besar dengan uppercase</h1>
<p class="paragraph">setiap kata akan berubah jadi kapital di awal.</p>
<p class="original">Teks ini tetap sesuai penulisan asli.</p>
</body>
</html>
