<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML dengan style CSS warna</title>
    <style>
        .bgcolor-rgb {
            background-color: rgb(220, 20, 60);
            padding: 15px;
            margin: 10px;
        }
        .bgcolor-rgba {
            background-color: rgba(148, 170, 188, 0.6);
            padding: 15px;
            margin: 10px;
        }
        .bgcolor-hsl {
            background-color: hsl(92, 87%, 27%);
            padding: 15px;
            margin: 10px;
        }
        .bgcolor-hsla {
            background-color: hsla(359, 62%, 31%, 0.8);
            padding: 15px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="bgcolor-rgb">Warna latar belakang dengan rgb</div>
    <div class="bgcolor-rgba">Warna latar belakang dengan rgba</div>
    <div class="bgcolor-hsl">Warna latar belakanag dengan hsl</div>
    <div class="bgcolor-hsla">Warna latar belakang dengan hsla</div>
</body>
</html>
