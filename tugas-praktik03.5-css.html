<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow</title>
    <style>
    h1 {
    text-shadow: 2px 2px 5px red, -2px -2px 5px blue;
    }
    .glow {
    text-shadow: 0px 0px 20px orange;
    }
    </style>
</head>
<body>
<h1>Contoh Text Shadow</h1>
<p class="glow">Teks ini punya efek glow oranye.</p>
</body>
</html>
