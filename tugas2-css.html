<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 CSS</title>
    <style>
        body {
            background-color: black;
            font-family: 'Arial Narrow';
            margin: 12px;
        }
        h1 {
            font-family:'Times New Roman' ;
            color: aqua;
        }
        h2 {
            font-family: 'Times New Roman';
            color: aqua;
        }
        p {
            font-family: 'Times New Roman';
            color: aqua;
        }
    </style>
</head>
<body>
    <h1>HTML dengan CSS internal</h1>
    <h2>Mengunakan tiga buah elemen (h1,h2,p)</h2>
    <p>Membuat sebuah HTML dengan CSS internal dan
       mengubah stylenya.</p>
</body>
</html>
