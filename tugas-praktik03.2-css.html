<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
        <style>
        h1 {
        text-decoration: underline;
        }
        .red-underline {
        text-decoration: underline red;
        }
        .wavy {
        text-decoration: underline wavy blue;
        }
        .none {
        text-decoration: none;
        }
        </style>
</head>
<body>
<h1>Contoh Text Decoration</h1>
<p><span class="red-underline">Teks dengan garis bawah merah</span></p>
<p><span class="wavy">Teks dengan underline bergelombang biru</span></p>
<p><a href="#" class="none">Link tanpa dekorasi</a></p>
</body>
</html>
