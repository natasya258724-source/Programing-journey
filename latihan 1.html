<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengubah jenis garis</title>
    <style>
        .solid {
            border: 4px solid black;
            padding: 20px;
            margin: 20px;
        }
        .double {
            border: 4px double blue;
            padding: 20px;
            margin: 20px;
        }
        .groove {
            border: 4px groove green;
            padding: 20px;
            margin: 20px;
        }
        .ridge {
            border: 4px ridge red;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="solid">Garis Solid</div>
    <div class="double">Garis Double</div>
    <div class="groove">Garis Groove</div>
    <div class="ridge">Garis Ridge</div>
</body>
</html>
