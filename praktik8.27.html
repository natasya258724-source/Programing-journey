<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe Element Input range</title>
</head>
<body>
    <from action="/submit" method="post">
        <label for="volume">Volume (between 0and 100):</label>
        <input type="range" id="volume" name="Volume" min="0"
        max="100" value="50" oninput="this.nextElementSibling.Value = this.Value">
        <output>50</output>
        <br><br>
        <input type="submit" value="submit">
    </from>
</body>
</html>
