<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat layout</title>
    <style>
        body {
            margin: 2px;
        }
        .header {
            width: 100px;
            height: 100%;
            background-color: gray;
        }
        .content {
            width: 300px;
            height: 100%;
            background-color: darkolivegreen;
        }
        .footer {
            width: 80px;
            height: 100%;
            background-color: forestgreen;
        }
    </style>

</head>
<body>
    <div class="header">
        Header dengan tinggi 100px dan lebar 100%
    </div>

    <div class="content">
        Content dengan tinggi 300px dan lebar 100%
    </div>
    
    <div class="footer">
        Footer dengan tinggi 80px dan lebar 100%
    </div>
</body>
</html>
