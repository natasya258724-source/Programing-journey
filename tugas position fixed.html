<!DOCTYPE html>
<html lang="id">
<head>
  <style>
    body {
      height: 2000px; /* supaya bisa di-scroll */
    }
    .fixed-top-left {
      position: fixed;
      top: 0;
      left: 0;
      background-color: coral;
      padding: 10px;
    }
    .fixed-left {
      position: fixed;
      top: 50%;
      left: 0;
      background-color: lightblue;
      padding: 10px;
    }
    .fixed-right {
      position: fixed;
      top: 50%;
      right: 0;
      background-color: lightgreen;
      padding: 10px;
    }
    .back-to-top {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background-color: yellow;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="fixed-top-left">Kiri Atas</div>
  <div class="fixed-left">Kiri Tengah</div>
  <div class="fixed-right">Kanan Tengah</div>
  <div class="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'});">
    Back to Top
  </div>
</body>
</html>
