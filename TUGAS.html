<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector HTML</title>
    <link rel="stylesheet" href="TUGAS.css">
    
</head>
<body>
    <h1>Penggunaan Selektor dalam HTML</h1>
    <!-- Selektor Tag -->
    <p>Ini merupakan contoh dari HTML dan CSS eksternal</p>
    <!-- Selektor Class : hitam -->
    <div class="hitam"></div>
    <!-- Selektor id nama id : abu-abu -->
    <div id="abu-abu">Ini adalah div dengan id merek abu-abu</div>
    <!-- Selektor Universal -->
    <p>Paragraf ini menggunakan  Selektor universal</p>
</body>
</html>
