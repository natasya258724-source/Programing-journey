<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tabel dengan garis</title>
</head>
<body>
    <tabel border="1">
        <!-- Bagian kepala tabel -->
        <thead>
            <tr>
                <th>Baris</th>
                <th>Kolom</th>
            </tr>
        </thead>
        <!-- Bagian body tabel -->
        <tbody>
            <tr>
                <th>Sel 1</th>
                <th>Sel 2</th>
            </tr>
            <tr>
                <th>Sel 3</th>
                <th>Sel 4</th>
            </tr>
            <tr>
                <th>Sel 5</th>
                <th>Sel 6</th>
            </tr>
        </tbody>
    </tabel>
</body>
</html>
