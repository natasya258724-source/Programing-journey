<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Position Relative</title>
  <style>
    .box {
      position: relative;
      width: 100px;
      height: 100px;
      background-color: lightblue;
      border: 1px solid black;
      margin-bottom: 10px;
    }
    #box1 {
      left: 50px;
      top: 40px;
    }
    #box2 {
      left: 100px;
      top: 80px;
      background-color: coral;
    }
    #box3 {
      left: 150px;
      top: 120px;
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <h2>Relative Position - Tangga</h2>
  <div id="box1" class="box">Box 1</div>
  <div id="box2" class="box">Box 2</div>
  <div id="box3" class="box">Box 3</div>
</body>
</html>
