<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Spacing</title>
    <style>
    .spaced {
    letter-spacing: 10px;
    }
    .loose {
    line-height: 2;
    }
    .wordspace {
    word-spacing: 15px;
    }
    </style>
</head>
<body>
<h1 class="spaced">Contoh Letter Spacing</h1>
<p class="loose">Paragraf ini memiliki line-height lebih longgar.</p>
<p class="wordspace">Paragraf ini memiliki jarak antar kata yang lebar.</p>
</body>
</html>
